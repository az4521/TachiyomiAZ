name: Android Master CI

on:
  push:
    branches:
      - 'master'

jobs:
  apk:
    name: Generate APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1

      - name: Write google-services.json
        uses: DamianReeves/write-file-action@v1.3
        with:
          # The path to the file to write
          path: app/google-services.json
          # The contents of the file
          contents: ${{ secrets.GOOGLE_SERVICES_TEXT }}
          # The mode of writing to use: `overwrite`, `append`, or `preserve`.
          write-mode: overwrite # optional, default is preserve

      # Guards the code shared with the iOS port. commonMain must not touch the Android SDK,
      # and iOS targets only compile on macOS -- so building the shared modules for plain JVM is
      # what actually proves they are still portable from a Linux runner. Also runs their tests,
      # which cover the rules both platforms have to agree on. Runs before the APKs so a
      # portability break fails fast rather than after a full release build.
      - name: Check shared modules
        uses: gradle/gradle-command-action@v2
        with:
          arguments: checkSharedPortability

      # Builds both API-level variants from the same code:
      #   standardApi21Release -> Android 5/6 (minSdk 21)
      #   standardApi24Release -> Android 7+  (minSdk 24)
      - name: Build APKs
        uses: gradle/gradle-command-action@v2
        with:
          arguments: assembleStandardApi21Release assembleStandardApi24Release

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Sign Android 5/6 (api21) release
        id: sign_android5
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/standardApi21/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Android 7+ (api24) release
        id: sign_android7
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/standardApi24/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Android 5/6 APK (minSdk 21)
        uses: actions/upload-artifact@v4
        with:
          name: TachiyomiAZ-android5-${{ github.sha }}
          path: ${{ steps.sign_android5.outputs.signedReleaseFile }}

      - name: Upload Android 7+ APK (minSdk 24)
        uses: actions/upload-artifact@v4
        with:
          name: TachiyomiAZ-android7-${{ github.sha }}
          path: ${{ steps.sign_android7.outputs.signedReleaseFile }}
