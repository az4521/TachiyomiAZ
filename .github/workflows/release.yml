name: Publish Release

# Publishes a GitHub release whenever the versionName in app/build.gradle changes.
# The release ships two APKs (Android 5-7 + Android 8+); the in-app updater picks
# the one matching each install via the "android5"/"android8" marker in the file name.
on:
  push:
    branches:
      - 'master'
    paths:
      - 'app/build.gradle'

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read versionName
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check whether release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.version }} already exists; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and publish
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1

      - name: Write google-services.json
        uses: DamianReeves/write-file-action@v1.3
        with:
          path: app/google-services.json
          contents: ${{ secrets.GOOGLE_SERVICES_TEXT }}
          write-mode: overwrite

      - name: Build APKs
        uses: gradle/gradle-command-action@v2
        with:
          arguments: assembleStandardApi21Release assembleStandardApi26Release

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Sign Android 5-7 (api21) release
        id: sign_android5
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/standardApi21/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Android 8+ (api26) release
        id: sign_android8
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/standardApi26/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Asset names matter for backwards compatibility. Installs running the OLD updater
      # have no variant awareness and always download assets[0]. GitHub's release-assets
      # API returns assets ordered by NAME (alphabetically), NOT by upload order, so the
      # first asset is simply the alphabetically-first file name.
      #
      # The old app only auto-updates on Android 7+, so the android8 APK must sort first.
      # Both names contain the "android5"/"android8" marker that the variant-aware updater
      # (GithubRelease.downloadLink) matches BuildConfig.APK_VARIANT against. Installs of
      # the old "android7" build find no match and fall back to assets[0] as well, which
      # is right on Android 8+; on Android 7 that APK won't install, so those users have
      # to switch to the legacy build by hand. The android5 build is prefixed "legacy-"
      # so it sorts AFTER android8 ("android8" < "legacy-android5").
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp "${{ steps.sign_android8.outputs.signedReleaseFile }}" "release-assets/TachiyomiAZ-${VERSION}-android8.apk"
          cp "${{ steps.sign_android5.outputs.signedReleaseFile }}" "release-assets/TachiyomiAZ-${VERSION}-legacy-android5.apk"
          ls -l release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            release-assets/TachiyomiAZ-${VERSION}-android8.apk \
            release-assets/TachiyomiAZ-${VERSION}-legacy-android5.apk
