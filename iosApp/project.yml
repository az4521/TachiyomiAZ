name: TachiyomiAZ
options:
  bundleIdPrefix: eu.kanade.tachiyomi
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Generated with XcodeGen so the project is a reviewable text file rather than a
# merge-hostile .pbxproj. Regenerate after adding files:
#
#     cd iosApp && xcodegen generate
#
# Two things this target needs that are not in git, both large binaries:
#
#   TachiyomiKit.xcframework  ./gradlew :shared-ios:assembleTachiyomiKitDebugXCFramework
#   Vendor/ and Resources/JVM  the OpenJDK Mobile runtime; see IOS_PORT.md
#
# Stage the JVM resources for the platform you are building before generating:
#
#     ./Scripts/stage-jvm-resources.sh simulator

packages:
  TachiJVMRunner:
    path: Packages/TachiJVMRunner
  # The source-facing model layer the vendored UI binds to. Vendored from tachiyomiazios, where
  # it was called AidokuRunner -- but that project had already replaced Aidoku's WASM runner with
  # one driving JVM extensions, so the Aidoku name described nothing that remained. Renamed to
  # match what it actually is.
  ExtensionRunner:
    path: Packages/ExtensionRunner
  # Versions matched to tachiyomiazios so the vendored UI compiles against what it was written
  # for. Nuke is also the image cache, which is why covers behave the same here as there.
  Nuke:
    url: https://github.com/kean/Nuke
    majorVersion: 13.0.0
  Gifu:
    url: https://github.com/kaishin/Gifu.git
    majorVersion: 3.4.0
  # Pinned to the same commit tachiyomiazios uses: the vendored manga list introspects with
  # `.iOS(.v18, .v26, .v27)`, and no tagged release declares those versions yet.
  SwiftUIIntrospect:
    url: https://github.com/siteline/swiftui-introspect
    revision: d2987affc5482a94d94aa730914aa26b124648a6
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    majorVersion: 2.10.1
  # Downloads are stored as CBZ, which is a zip; the vendored download subsystem reads and writes
  # them through this.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    majorVersion: 0.9.0
  # Manga descriptions arrive as markdown from some sources; the details header renders them.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    majorVersion: 2.0.0

targets:
  TachiyomiAZ:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          # Kept for reference, not compiled -- see Sources/Vendored/_excluded/README.md
          - "Vendored/_excluded/**"
      # The JVM runtime is copied in wholesale. JVMRuntimeConfiguration resolves these by name
      # against the bundle's resource root, so the folder must land flattened rather than nested
      # under a group -- hence "folder" rather than "group".
      # Image assets. Xcode generates the symbol accessors the vendored UI uses (UIImage
      # .mangaPlaceholder and friends) from this catalog.
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # The vendored UI's strings. Every label goes through NSLocalizedString, so without these
      # the interface renders raw keys (APPEARANCE, INCOGNITO_MODE). Each .lproj is referenced
      # directly rather than their parent directory: iOS resolves localizations only at the bundle
      # root, so copying a "Localization" folder in would leave every string unfound.
      - path: Resources/Localization/af.lproj
        type: folder
        buildPhase: resources
      - path: Resources/Localization/ar.lproj
        type: folder
        buildPhase: resources
      - path: Resources/Localization/bg.lproj
        type: folder
        buildPhase: resources
      - path: Resources/Localization/cs.lproj
        type: folder
        buildPhase: resources
      - path: Resources/Localization/de.lproj
        type: folder
        buildPhase: resources
      - path: Resources/Localization/el.lproj
