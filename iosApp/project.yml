      - path: Resources/JVM/java_bundle
        type: folder
        buildPhase: resources
      - path: Resources/JVM/tachiaz-compat
        type: folder
        buildPhase: resources
      - path: Resources/JVM/tachiaz-extension-host.jar
        buildPhase: resources
      - path: Resources/JVM/tachiaz-mobile-shims.jar
        buildPhase: resources
    dependencies:
      # Static frameworks: linked at build time, so they must not also be embedded.
      - framework: ../shared-ios/build/XCFrameworks/debug/TachiyomiKit.xcframework
        embed: false
        link: true
      - framework: Vendor/jvm/OpenJDK.xcframework
        embed: false
        link: true
      # The webtoon reader renders pages as Texture nodes, from the same fork tachiyomiazios pins.
      # Declared as a package it is a binaryTarget, and SPM's artifact download for it hangs
      # indefinitely, so the xcframework is fetched once and linked directly instead. Replace with
      #   ./Scripts/fetch-texture.sh
      - framework: Vendor/AsyncDisplayKit.xcframework
        embed: true
        link: true
      - package: TachiJVMRunner
      - package: ExtensionRunner
        product: ExtensionRunner
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: Gifu
      - package: SwiftUIIntrospect
      - package: SwiftSoup
      - package: ZIPFoundation
      - package: MarkdownUI
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TachiyomiAZ
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        # Extension sources and self-hosted servers such as Komga may use user-configured HTTP
        # endpoints on a private LAN. Their hosts cannot be enumerated as ATS exceptions.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connect to self-hosted manga servers such as Komga on your local or Tailscale network.
        # OAuth callback for MyAnimeList and AniList sign-in.
        CFBundleURLTypes:
          - CFBundleURLName: eu.kanade.tachiyomi.az.ios.oauth
            # Existing tracker applications registered Aidoku's callback URI. Keep accepting it
            # alongside the app's own scheme so those OAuth sessions can return to the app.
            CFBundleURLSchemes: [tachiyomiaz, aidoku]
          # The repository links the Android app answers: `tachiyomi://add-repo?url=` and
          # `mihon://extension-store?url=`, which is what a repository's "add to app" button
          # produces. `TachiyomiXJarRepository.repositoryURL(fromDeepLink:)` already read both,
          # but iOS only delivers a URL to an app that has declared its scheme, so nothing ever
          # arrived and the link opened nothing.
          - CFBundleURLName: eu.kanade.tachiyomi.az.ios.repository
            CFBundleURLSchemes: [tachiyomi, mihon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.kanade.tachiyomi.az.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The asset catalog carries image assets only. Left unset, Xcode requires an "AppIcon" set
        # in it; the app has no icon artwork of its own yet, and the fork's is Aidoku's.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Simulator only. allow-jit and allow-unsigned-executable-memory are macOS
        # hardened-runtime entitlements: the Simulator needs them because it runs as a macOS
        # process, a real device neither needs nor is granted them, and requesting them on a
        # personal team makes device signing fail outright.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Sources/TachiyomiAZ.entitlements
        DEVELOPMENT_TEAM: RRKT2YAH28
        CODE_SIGN_STYLE: Automatic
        # -lsqlite3 for SQLDelight's native driver; the rest are what the statically linked
        # mobile VM pulls in -- it has no dynamic framework to carry its own dependencies.
        OTHER_LDFLAGS: "-lsqlite3 -lz -liconv -lc++ -framework CoreGraphics -framework CoreText -framework ImageIO -framework JavaScriptCore -framework Security"
