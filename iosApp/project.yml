name: TachiyomiAZ
options:
  bundleIdPrefix: eu.kanade.tachiyomi
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Generated with XcodeGen so the project is a reviewable text file rather than a
# merge-hostile .pbxproj. Regenerate after adding files:
#
#     cd iosApp && xcodegen generate
#
# Two things this target needs that are not in git, both large binaries:
#
#   TachiyomiKit.xcframework  ./gradlew :shared-ios:assembleTachiyomiKitDebugXCFramework
#   Vendor/ and Resources/JVM  the OpenJDK Mobile runtime; see IOS_PORT.md
#
# Stage the JVM resources for the platform you are building before generating:
#
#     ./Scripts/stage-jvm-resources.sh simulator

packages:
  TachiJVMRunner:
    path: Packages/TachiJVMRunner

targets:
  TachiyomiAZ:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The JVM runtime is copied in wholesale. JVMRuntimeConfiguration resolves these by name
      # against the bundle's resource root, so the folder must land flattened rather than nested
      # under a group -- hence "folder" rather than "group".
      - path: Resources/JVM/java_bundle
        type: folder
        buildPhase: resources
      - path: Resources/JVM/tachiaz-compat
        type: folder
        buildPhase: resources
      - path: Resources/JVM/tachiaz-extension-host.jar
        buildPhase: resources
      - path: Resources/JVM/tachiaz-mobile-shims.jar
        buildPhase: resources
    dependencies:
      # Static frameworks: linked at build time, so they must not also be embedded.
      - framework: ../shared-ios/build/XCFrameworks/debug/TachiyomiKit.xcframework
        embed: false
        link: true
      - framework: Vendor/jvm/OpenJDK.xcframework
        embed: false
        link: true
      - package: TachiJVMRunner
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TachiyomiAZ
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        # OAuth callback for MyAnimeList and AniList sign-in.
        CFBundleURLTypes:
          - CFBundleURLName: eu.kanade.tachiyomi.az.ios.oauth
            CFBundleURLSchemes: [tachiyomiaz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.kanade.tachiyomi.az.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: Sources/TachiyomiAZ.entitlements
        # -lsqlite3 for SQLDelight's native driver; the rest are what the statically linked
        # mobile VM pulls in -- it has no dynamic framework to carry its own dependencies.
        OTHER_LDFLAGS: "-lsqlite3 -lz -liconv -lc++ -framework CoreGraphics -framework CoreText -framework ImageIO -framework JavaScriptCore -framework Security"
