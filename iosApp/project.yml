name: TachiyomiAZ
options:
  bundleIdPrefix: eu.kanade.tachiyomi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Generated with XcodeGen so the project is a reviewable text file rather than a
# merge-hostile .pbxproj. Regenerate after adding files:
#
#     cd iosApp && xcodegen generate
#
# TachiyomiKit.xcframework is produced by the Gradle umbrella module and is not checked in:
#
#     ./gradlew :shared-ios:assembleTachiyomiKitDebugXCFramework

targets:
  TachiyomiAZ:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      # Static framework: linked in at build time, so it must not also be embedded.
      - framework: ../shared-ios/build/XCFrameworks/debug/TachiyomiKit.xcframework
        embed: false
        link: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TachiyomiAZ
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.kanade.tachiyomi.az.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Kotlin/Native's SQLDelight driver links the system SQLite.
        OTHER_LDFLAGS: "-lsqlite3"
