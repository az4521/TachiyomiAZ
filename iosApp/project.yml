name: TachiyomiAZ
options:
  bundleIdPrefix: eu.kanade.tachiyomi
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Generated with XcodeGen so the project is a reviewable text file rather than a
# merge-hostile .pbxproj. Regenerate after adding files:
#
#     cd iosApp && xcodegen generate
#
# Two things this target needs that are not in git, both large binaries:
#
#   TachiyomiKit.xcframework  ./gradlew :shared-ios:assembleTachiyomiKitDebugXCFramework
#   Vendor/ and Resources/JVM  the OpenJDK Mobile runtime; see IOS_PORT.md
#
# Stage the JVM resources for the platform you are building before generating:
#
#     ./Scripts/stage-jvm-resources.sh simulator

packages:
  TachiJVMRunner:
    path: Packages/TachiJVMRunner
  # The source-facing model layer the vendored UI binds to. Vendored from tachiyomiazios, where
  # it was called AidokuRunner -- but that project had already replaced Aidoku's WASM runner with
  # one driving JVM extensions, so the Aidoku name described nothing that remained. Renamed to
  # match what it actually is.
  ExtensionRunner:
    path: Packages/ExtensionRunner
  # Versions matched to tachiyomiazios so the vendored UI compiles against what it was written
  # for. Nuke is also the image cache, which is why covers behave the same here as there.
  Nuke:
    url: https://github.com/kean/Nuke
    majorVersion: 13.0.0
  Gifu:
    url: https://github.com/kaishin/Gifu.git
    majorVersion: 3.4.0
  SwiftUIIntrospect:
    url: https://github.com/siteline/swiftui-introspect
    majorVersion: 1.0.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    majorVersion: 2.10.1

targets:
  TachiyomiAZ:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          # The vendored tachiyomiazios UI is in-tree but not yet compiled. Migration is partly
          # done and the remaining work is known; see Sources/Vendored/README.md. Excluding it
          # keeps the app building while that continues.
          - "Vendored/**"
      # The JVM runtime is copied in wholesale. JVMRuntimeConfiguration resolves these by name
      # against the bundle's resource root, so the folder must land flattened rather than nested
      # under a group -- hence "folder" rather than "group".
      - path: Resources/JVM/java_bundle
        type: folder
        buildPhase: resources
      - path: Resources/JVM/tachiaz-compat
        type: folder
        buildPhase: resources
      - path: Resources/JVM/tachiaz-extension-host.jar
        buildPhase: resources
      - path: Resources/JVM/tachiaz-mobile-shims.jar
        buildPhase: resources
    dependencies:
      # Static frameworks: linked at build time, so they must not also be embedded.
      - framework: ../shared-ios/build/XCFrameworks/debug/TachiyomiKit.xcframework
        embed: false
        link: true
      - framework: Vendor/jvm/OpenJDK.xcframework
        embed: false
        link: true
      - package: TachiJVMRunner
      - package: ExtensionRunner
        product: ExtensionRunner
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: Gifu
      - package: SwiftUIIntrospect
      - package: SwiftSoup
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TachiyomiAZ
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        # OAuth callback for MyAnimeList and AniList sign-in.
        CFBundleURLTypes:
          - CFBundleURLName: eu.kanade.tachiyomi.az.ios.oauth
            CFBundleURLSchemes: [tachiyomiaz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.kanade.tachiyomi.az.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Simulator only. allow-jit and allow-unsigned-executable-memory are macOS
        # hardened-runtime entitlements: the Simulator needs them because it runs as a macOS
        # process, a real device neither needs nor is granted them, and requesting them on a
        # personal team makes device signing fail outright.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Sources/TachiyomiAZ.entitlements
        DEVELOPMENT_TEAM: RRKT2YAH28
        CODE_SIGN_STYLE: Automatic
        # -lsqlite3 for SQLDelight's native driver; the rest are what the statically linked
        # mobile VM pulls in -- it has no dynamic framework to carry its own dependencies.
        OTHER_LDFLAGS: "-lsqlite3 -lz -liconv -lc++ -framework CoreGraphics -framework CoreText -framework ImageIO -framework JavaScriptCore -framework Security"
